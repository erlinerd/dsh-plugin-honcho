name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm check
      - name: Pack the plugin tarball
        run: |
          version=$(node -p "require('./package.json').version")
          pnpm pack --pack-destination .
          mv "dsh-plugin-honcho-${version}.tgz" "dsh-plugin-honcho-v${version}.tgz"
          shasum -a 256 "dsh-plugin-honcho-v${version}.tgz" > "dsh-plugin-honcho-v${version}.tgz.sha256"
          shasum -a 256 -c "dsh-plugin-honcho-v${version}.tgz.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" \
            "dsh-plugin-honcho-v${version}.tgz" \
            "dsh-plugin-honcho-v${version}.tgz.sha256" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
