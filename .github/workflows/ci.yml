name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # typecheck/build additionally need local @deepseek-ai/dsh-session and
      # dsh-home-paths types (not on npm yet); run `pnpm typecheck && pnpm
      # build` in an environment with a DeepSeek Harness install
      # (`node scripts/dev-setup.mjs`).
